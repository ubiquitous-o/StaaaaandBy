name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # gradle.properties の org.gradle.java.home はローカルMac用なのでCIでは上書きする
        run: ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Rename APK
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "StaaaaandBy-${TAG_NAME}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: StaaaaandBy-*.apk
          generate_release_notes: true
